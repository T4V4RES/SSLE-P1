apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: ssle-project
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: ssle-project
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: ssle-project
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: ssle-project
roleRef:
  kind: Role
  name: prometheus
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: ssle-project
data:
  prometheus.yml: "global:\n  scrape_interval: 15s\n  evaluation_interval: 15s\n \
    \ external_labels:\n    site: coimbra\nalerting:\n  alertmanagers:\n  - static_configs:\n\
    \    - targets:\n      - prom-global.incus:9093\nrule_files:\n- /etc/prometheus/rules.yml\n\
    scrape_configs:\n- job_name: ssle\n  kubernetes_sd_configs:\n  - role: pod\n \
    \   namespaces:\n      names:\n      - ssle-project\n  relabel_configs:\n  - source_labels:\n\
    \    - __meta_kubernetes_pod_container_port_name\n    regex: metrics\n    action:\
    \ keep\n  - source_labels:\n    - __meta_kubernetes_pod_phase\n    regex: Running\n\
    \    action: keep\n  - source_labels:\n    - __meta_kubernetes_pod_label_app\n\
    \    target_label: service\n    regex: (.*)\n    replacement: ${1}-service\n \
    \ - source_labels:\n    - __meta_kubernetes_pod_node_name\n    target_label: node\n\
    \  - source_labels:\n    - __meta_kubernetes_pod_name\n    target_label: replica\n\
    \  - target_label: city\n    replacement: coimbra\n  - target_label: country\n\
    \    replacement: pt\n  - target_label: datacenter\n    replacement: dc1\n  -\
    \ target_label: rack\n    replacement: rack1\n  - source_labels:\n    - __meta_kubernetes_pod_node_name\n\
    \    - __meta_kubernetes_pod_label_app\n    - __meta_kubernetes_pod_name\n   \
    \ regex: (.*);(.*);(.*)\n    target_label: instance_id\n    replacement: pt.coimbra.dc1.rack1.${1}.${2}.${3}\n"
  rules.yml: "groups:\n- name: site-aggregates\n  rules:\n  - record: site:ssle_http_requests:rate1m\n\
    \    expr: sum by (service) (rate(ssle_http_requests_total{job=\"ssle\"}[1m]))\n\
    \  - record: site:ssle_http_errors:ratio1m\n    expr: \"sum by (service) (rate(ssle_http_requests_total{job=\\\
    \"ssle\\\", code=\\\"5xx\\\"\\\n      }[1m]))\\n  / clamp_min(sum by (service)\
    \ (rate(ssle_http_requests_total{job=\\\"\\\n      ssle\\\"}[1m])), 1e-9)\\n\"\
    \n  - record: site:ssle_http_latency_p95:1m\n    expr: histogram_quantile(0.95,\
    \ sum by (service, le) (rate(ssle_http_request_duration_seconds_bucket{job=\"\
    ssle\"}[1m])))\n  - record: site:ssle_instances_up:sum\n    expr: sum by (service)\
    \ (up{job=\"ssle\"})\n- name: site-alerts\n  rules:\n  - alert: SsleInstanceDown\n\
    \    expr: up{job=\"ssle\"} == 0\n    for: 30s\n    labels:\n      severity: critical\n\
    \    annotations:\n      summary: Instancia {{ $labels.instance_id }} em baixo\n\
    \      description: '{{ $labels.service }} no no {{ $labels.node }} ({{ $labels.rack\n\
    \        }}) nao responde.'\n  - alert: SsleHighLatency\n    expr: site:ssle_http_latency_p95:1m\
    \ > 0.5\n    for: 1m\n    labels:\n      severity: warning\n    annotations:\n\
    \      summary: Latencia p95 alta em {{ $labels.service }}\n      description:\
    \ p95 = {{ $value | humanizeDuration }} (baseline < 50ms).\n  - alert: SsleErrorRate\n\
    \    expr: site:ssle_http_errors:ratio1m > 0.05\n    for: 1m\n    labels:\n  \
    \    severity: warning\n    annotations:\n      summary: Erros 5xx em {{ $labels.service\
    \ }}\n      description: '{{ $value | humanizePercentage }} dos pedidos falham.'\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ssle-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prometheus
        image: prom/prometheus:v3.5.0
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=24h
        ports:
        - containerPort: 9090
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: data
          mountPath: /prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ssle-project
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
  - port: 9090
    nodePort: 30090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-management
  namespace: ssle-project
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - protocol: TCP
      port: 9090
  egress:
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
    - protocol: TCP
      port: 9093
