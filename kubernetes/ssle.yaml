        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: REGISTRY_URL
          value: http://registry:5050
        - name: SERVICE_URL
          value: http://$(POD_IP):5003
        - name: INSTANCE_ID
          value: pt.coimbra.dc1.rack1.$(NODE_NAME).analytics.$(POD_NAME)
        readinessProbe:
          httpGet:
            path: /health
            port: 5003
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5003
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 200m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health
            port: 5003
          failureThreshold: 30
          periodSeconds: 5
      automountServiceAccountToken: false
