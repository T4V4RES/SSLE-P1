        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: analytics
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: analytics
  namespace: ssle-project
spec:
  type: ClusterIP
  selector:
    app: analytics
  ports:
  - port: 5003
    targetPort: 5003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor
  namespace: ssle-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sensor
  template:
    metadata:
      labels:
        app: sensor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: sensor
        image: ssle/sensor:project1
        imagePullPolicy: Never
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: REGISTRY_URL
          value: http://registry:5050
        - name: DEVICE_ID
          value: pt.coimbra.dc1.rack1.$(NODE_NAME).sensor.temperature.01
        - name: INTERVAL_MS
          value: '5000'
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            cpu: 100m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: project-budget
  namespace: ssle-project
spec:
  hard:
    requests.cpu: '2'
    requests.memory: 1Gi
    limits.cpu: '4'
    limits.memory: 2Gi
    pods: '20'
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: project-isolation
  namespace: ssle-project
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
  egress:
  - to:
    - podSelector: {}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
