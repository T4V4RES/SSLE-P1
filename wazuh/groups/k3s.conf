<!-- Config partilhada do grupo "k3s" (nos k3s-master e k3s-node1): le o log
     dos contentores de ingestao, onde ficam as recusas com o IP de origem. -->
<agent_config>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/containers/ingestion-*.log</location>
  </localfile>
</agent_config>
